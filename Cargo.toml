[package]
name = "quipu-math-wasm"
version = "0.1.0"
description = "Incan knotted cord (quipu) encoding compiled to WebAssembly"
license = "MIT"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
